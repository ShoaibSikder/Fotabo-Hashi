name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fotabo_hashi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d fotabo_hashi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: test-only-secret-key-that-is-at-least-32-bytes-long
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://fotabo_hashi_app:test-only-app-password@127.0.0.1:5432/fotabo_hashi_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/1
      SENTRY_DSN: ""
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Provision restricted application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=fotabo_hashi_test --command="CREATE ROLE fotabo_hashi_app LOGIN PASSWORD 'test-only-app-password' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql --host=127.0.0.1 --username=postgres --dbname=fotabo_hashi_test --command="GRANT CONNECT ON DATABASE fotabo_hashi_test TO fotabo_hashi_app;"
          psql --host=127.0.0.1 --username=postgres --dbname=fotabo_hashi_test --command="GRANT USAGE, CREATE ON SCHEMA public TO fotabo_hashi_app;"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: pytest
      - name: OpenAPI validation
        run: |
          python manage.py spectacular --file schema.yml
          python manage.py spectacular --validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
