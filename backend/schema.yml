        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - FULFILLED
        description: |-
          * `ACTIVE` - Active
          * `FULFILLED` - Fulfilled
          * `CANCELLED` - Cancelled
