            schema:
              $ref: '#/components/schemas/BloodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodRequest'
        required: true
      security:
      - BearerJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
