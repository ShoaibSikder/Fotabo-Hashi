  /api/v1/admin/audit/:
    get:
      operationId: admin_audit_list
      description: Read-only audit activity for admins; excludes IP, user-agent and
        metadata.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CREATE
          - DELETE
          - LOGIN
          - LOGOUT
          - SECURITY
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `LOGIN` - Login
          * `LOGOUT` - Logout
          * `SECURITY` - Security
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource_type
        schema:
          type: string
      tags:
      - Administration
      security:
      - BearerJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogAdminList'
          description: ''
