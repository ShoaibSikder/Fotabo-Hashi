  /api/v1/blood-requests/:
    get:
      operationId: blood_requests_list
      parameters:
      - in: query
        name: blood_group
        schema:
          type: string
          enum:
          - A+
          - A-
          - AB+
          - AB-
          - B+
          - B-
          - O+
          - O-
        description: |-
          * `A+` - A+
          * `A-` - A-
          * `B+` - B+
          * `B-` - B-
          * `AB+` - AB+
          * `AB-` - AB-
          * `O+` - O+
          * `O-` - O-
