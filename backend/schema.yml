  /api/v1/blood-requests/:
    get:
      operationId: blood_requests_list
      parameters:
      - in: query
        name: blood_group
        schema:
          type: string
          enum:
          - A+
          - A-
          - AB+
          - AB-
          - B+
          - B-
          - O+
          - O-
        description: |-
          * `A+` - A+
          * `A-` - A-
          * `B+` - B+
          * `B-` - B-
          * `AB+` - AB+
          * `AB-` - AB-
          * `O+` - O+
          * `O-` - O-
      - in: query
        name: location
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - CANCELLED
          - FULFILLED
        description: |-
          * `ACTIVE` - Active
          * `FULFILLED` - Fulfilled
          * `CANCELLED` - Cancelled
      tags:
      - blood-requests
      security:
      - BearerJWT: []
      responses:
