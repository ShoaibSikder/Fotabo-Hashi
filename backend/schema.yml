components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGOUT
      - SECURITY
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `SECURITY` - Security
    AdminBloodRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester_id:
          type: integer
        requester_email:
          type: string
          format: email
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        required_units:
          type: integer
          maximum: 2147483647
          minimum: 0
        location:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blood_group
      - created_at
      - id
      - location
      - requester_email
      - requester_name
      - required_units
      - updated_at
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        name:
          type: string
        phone:
          type: string
        blood_group:
